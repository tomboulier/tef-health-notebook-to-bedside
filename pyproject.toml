# Project metadata and dependencies (PEP 621).
# Direct dependencies are pinned to exact versions here; uv.lock pins every
# transitive dependency too. Install with `uv sync` (see the README).

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "hello-world-medical-imaging"
# The version is managed by python-semantic-release from the commit history
# (see docs/automation.md). Do not edit it by hand.
version = "1.0.0"
description = "From notebook to bedside: the 'Hello World Deep Learning in Medical Imaging' tutorial as reproducible, tested, documented code."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Thomas Boulier" }]
license = "MIT"
dependencies = [
    "tensorflow==2.21.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "matplotlib==3.11.2",
]

[project.scripts]
hello-world-medical-imaging = "hello_world_medical_imaging.cli:main"

[dependency-groups]
# Installed by default by `uv sync`: the tools used to check the code.
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
]
# Builds the documentation site (`uv run mkdocs build --strict`).
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
]
# Computes the version number and the changelog from the commit messages.
release = [
    "python-semantic-release==10.7.0",
]
# Only needed to open or run the demonstration notebook (`uv sync --group notebook`).
notebook = [
    "papermill==2.7.0",
    "ipykernel==7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hello_world_medical_imaging"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
# pytest also runs the examples written in the docstrings (doctests).
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

# ---------------------------------------------------------------------------
# Linting and formatting with Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "SIM",     # simplify
    "D",       # pydocstyle: every public module, class and function has a docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]                        # test names are their documentation
"notebooks/*" = ["D"]

# ---------------------------------------------------------------------------
# Static typing with mypy. TensorFlow and Keras ship no type information, so
# their imports are not checked; our own code is checked strictly.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tensorflow.*", "keras.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Version number and changelog derived from Conventional Commits
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["CITATION.cff:version"]
# uv.lock records the version of the package too: lock again after the version
# is bumped, with the uv version of the Dockerfile and the CI, and include the
# file in the release commit.
build_command = "python -m pip install --quiet uv==0.11.32 && python -m uv lock && git add uv.lock"
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
default_templates = { changelog_file = "CHANGELOG.md" }

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
