# Experiment configuration: everything that may change from one run to the
# next lives here rather than in the code. Paths are relative to the root of
# the repository.

# Where the images are unpacked (ignored by Git).
dataset_directory = "data/Open_I_abd_vs_CXRs"

# Images are resized to image_size x image_size pixels (Inception V3 expects 299).
image_size = 299
batch_size = 5
epochs = 20
learning_rate = 0.0001

# Seed of every random number generator (Python, NumPy, TensorFlow).
seed = 42

# Random transformations of the training images, with the ranges and units of
# the original notebook's ImageDataGenerator.
[augmentation]
rotation_degrees = 20.0
zoom_range = 0.2
shift_range = 0.2
shear_degrees = 0.2
horizontal_flip = true
