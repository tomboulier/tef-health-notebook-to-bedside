# Experiment configuration: everything that may change from one run to the
# next lives here rather than in the code. Every value has a default in
# src/hello_world_medical_imaging/config.py. Paths are relative to the root of
# the repository.

# Where the images are downloaded from (the original tutorial repository, at a
# fixed commit) and where they are unpacked (ignored by Git).
dataset_url = "https://raw.githubusercontent.com/paras42/Hello_World_Deep_Learning/9921a12c905c00a88898121d5dc538e3b524e520/Open_I_abd_vs_CXRs.zip"
# The same archive is preserved by Software Heritage, the universal archive of
# source code. If the GitHub repository ever disappears, use this address:
# https://archive.softwareheritage.org/api/1/content/sha1_git:309c512a6c3bf221dfb29d57be875a5e65c9086f/raw/
# Checksum of the archive: the download stops if the data are not these ones.
dataset_sha256 = "6ac1f72507d9ff325ea0ba5f94a849849cf0f828614f24ee2fd88cb9008b264d"
dataset_directory = "data/Open_I_abd_vs_CXRs"

# Where the trained model, the training curves and other results are written (ignored by Git).
output_directory = "outputs"

# Images are resized to image_size x image_size pixels (Inception V3 expects 299).
image_size = 299
batch_size = 5
epochs = 20
learning_rate = 0.0001

# Seed of every random number generator (Python, NumPy, TensorFlow).
seed = 42

# Random transformations of the training images, with the ranges and units of
# the original notebook's ImageDataGenerator.
[augmentation]
rotation_degrees = 20.0
zoom_range = 0.2
shift_range = 0.2
shear_degrees = 0.2
horizontal_flip = true
